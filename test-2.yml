steps:
  - label: ":hammer: Build + upload artifact"
    command: |
      set -euo pipefail

      mkdir -p dist
      echo "hello from build ${BUILDKITE_BUILD_ID}" > dist/info.txt
      tar -czf dist/release.tgz -C dist info.txt

      buildkite-agent artifact upload "dist/release.tgz"

      echo "Writing triggered build id back to parent via job ${PARENT_TRIGGER_JOB_ID}"
      buildkite-agent meta-data set "triggered_build_id" "$$BUILDKITE_BUILD_ID" --job "$$PARENT_TRIGGER_JOB_ID"
