# Child pipeline (the triggered “build” pipeline)
steps:
  - label: ":hammer: Build + upload artifact, then report build id back to parent"
    command: |
      set -euo pipefail

      mkdir -p dist
      echo "hello from build ${BUILDKITE_BUILD_ID}" > dist/info.txt
      tar -czf dist/release.tgz -C dist info.txt

      buildkite-agent artifact upload "dist/release.tgz"

      echo "Child build id: ${BUILDKITE_BUILD_ID}"
      echo "Child job id: ${BUILDKITE_JOB_ID}"
    
