# Parent pipeline (the triggering “release” pipeline)
steps:
  - label: ":arrow_right: Trigger build pipeline"
    key: "trigger_build"
    trigger: "merge"   # slug of the child pipeline
    build: 
     env:
      PARENT_TRIGGER_JOB_ID: "${BUILDKITE_JOB_ID}"
  - wait: ~
  - command: |
      child_build_id="$(buildkite-agent meta-data get 'child_build_id')"
      echo "child_build_id=${child_build_id}"
      buildkite-agent artifact download "dist/release.tgz" . --build "$thing"
